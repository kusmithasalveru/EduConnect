# Shared configuration. Environment-specific values live in
# application-dev.yml (default, local development) and application-prod.yml.
spring:
  profiles:
    default: dev
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}

app:
  jwt:
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  # Directory where uploaded files (profile images) are stored. Relative paths
  # resolve against the working directory.
  upload-dir: ${UPLOAD_DIR:uploads}
