# Production profile. Activated with SPRING_PROFILES_ACTIVE=prod (set in the Dockerfile).
# Values without a fallback are required: the application refuses to start if they are missing.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

app:
  jwt:
    # Base64-encoded key, at least 32 bytes once decoded. Generate with:
    #   openssl rand -base64 48
    secret: ${JWT_SECRET}
  cors:
    # Comma-separated browser origins allowed to call the API,
    # e.g. https://educonnect.kusmithasalveru.in
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    allow-admin-registration: ${ALLOW_ADMIN_REGISTRATION:false}
