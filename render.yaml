# Render Blueprint: Spring Boot API only.
# The React frontend is deployed on Vercel (see EduConnect_Frontend/vercel.json and DEPLOYMENT.md).
services:
  - type: web
    name: educonnect-backend
    runtime: docker
    rootDir: EduConnect_Backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: CORS_ALLOWED_ORIGINS
        value: https://educonnect.kusmithasalveru.in
      # Secrets: entered in the Render dashboard (or via API), never committed.
      - key: DB_URL          # jdbc:postgresql://<neon-host>/<db>?sslmode=require
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET      # openssl rand -base64 48
        sync: false
