services:
  # Backend Service - Spring Boot API
  - type: web
    name: educonnect-backend
    runtime: docker
    rootDir: EduConnect_Backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/educonnect-backend-1.0.0.jar
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION_MS
        value: 86400000

  # Frontend Service - React + Vite  
  - type: web
    name: educonnect-frontend
    runtime: static
    rootDir: EduConnect_Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://educonnect-backend.onrender.com
